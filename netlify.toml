# Сборка на Netlify: статический сайт, сервера нет — вся логика в браузере.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# одностраничное приложение: любой адрес (/a/…, /find/…) отдаёт index.html,
# а дальше маршрут разбирает react-router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# файлы сборки с хешем в имени не меняются никогда
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
